name = "apex-backend-local"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"

# D1 Database binding for local development
[[d1_databases]]
binding = "DB"
database_name = "apex-fusion-db"
database_id = "071fab92-f25c-4932-a110-11b38579bc38"

# R2 Storage binding for local development
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "apex-fusion-storage"
